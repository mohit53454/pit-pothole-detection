<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>🕳️ Pothole Detector</title>
<style>
  :root { --accent:#ff5722; --bg:#121212; --card:#1e1e1e; --txt:#eee; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--txt); }
  header { padding:14px 16px; background:var(--card); text-align:center; }
  header h1 { margin:0; font-size:1.15rem; }
  header p { margin:4px 0 0; font-size:.8rem; opacity:.7; }
  main { padding:14px; max-width:640px; margin:0 auto; }
  .row { display:flex; gap:10px; margin-bottom:12px; }
  .btn { flex:1; padding:13px; border:0; border-radius:12px; font-size:1rem;
         font-weight:600; background:var(--accent); color:#fff; text-align:center;
         cursor:pointer; }
  .btn.sec { background:#333; }
  input[type=file] { display:none; }
  #stage { position:relative; background:#000; border-radius:12px; overflow:hidden;
           min-height:180px; display:flex; align-items:center; justify-content:center; }
  #stage img { width:100%; display:block; }
  #canvas { position:absolute; top:0; left:0; width:100%; height:100%; }
  #hint { opacity:.45; font-size:.9rem; padding:40px 10px; text-align:center; }
  #status { margin-top:10px; font-size:.85rem; min-height:1.2em; text-align:center; opacity:.85; }
  .legend { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; font-size:.75rem; }
  .legend span { display:flex; align-items:center; gap:5px; background:var(--card);
                 padding:5px 8px; border-radius:8px; }
  .dot { width:10px; height:10px; border-radius:50%; display:inline-block; }
  #thumbs { display:flex; gap:8px; overflow-x:auto; margin-top:12px; padding-bottom:4px; }
  #thumbs img { height:64px; border-radius:8px; cursor:pointer; border:2px solid transparent; }
  #thumbs img:hover { border-color:var(--accent); }
</style>
</head>
<body>
<header>
  <h1>🕳️ Pothole Detector</h1>
  <p>RDD2022-India · YOLOv8n · snap a damaged road &amp; see the boxes</p>
</header>
<main>
  <div class="row">
    <label class="btn" for="cam">📷 Take / Choose Photo</label>
    <input id="cam" type="file" accept="image/*" capture="environment">
    <button class="btn sec" id="sampleBtn">🗂️ Sample</button>
  </div>

  <div id="stage">
    <div id="hint">Take a photo of a road, or tap <b>Sample</b> to try a real RDD2022 test image.</div>
    <img id="photo" style="display:none" alt="">
    <canvas id="canvas"></canvas>
  </div>

  <div id="status"></div>

  <div class="legend">
    <span><i class="dot" style="background:#4fc3f7"></i>D00 longitudinal</span>
    <span><i class="dot" style="background:#ffd54f"></i>D10 transverse</span>
    <span><i class="dot" style="background:#81c784"></i>D20 alligator</span>
    <span><i class="dot" style="background:#e57373"></i>D40 pothole</span>
  </div>

  <div id="thumbs"></div>
</main>

<script>
const COLORS = ["#4fc3f7", "#ffd54f", "#81c784", "#e57373"];
const photo = document.getElementById("photo");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const statusEl = document.getElementById("status");
const stage = document.getElementById("stage");
const hint = document.getElementById("hint");

async function detect(blob, sourceLabel) {
  statusEl.textContent = "🔍 Analyzing…";
  hint.style.display = "none";
  photo.src = URL.createObjectURL(blob);
  photo.style.display = "block";
  await photo.decode();

  const fd = new FormData();
  fd.append("image", blob, "photo.jpg");
  const t0 = performance.now();
  const resp = await fetch("/predict", { method: "POST", body: fd });
  if (!resp.ok) { statusEl.textContent = "❌ Server error " + resp.status; return; }
  const data = await resp.json();
  const ms = Math.round(performance.now() - t0);

  canvas.width = photo.naturalWidth;
  canvas.height = photo.naturalHeight;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.lineWidth = Math.max(3, canvas.width / 250);
  ctx.font = `bold ${Math.max(14, canvas.width / 45)}px system-ui`;

  for (const b of data.boxes) {
    const [x1, y1, x2, y2] = b.xyxy;
    ctx.strokeStyle = COLORS[b.cls];
    ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);
    const tag = `${b.label.split(" ")[0]} ${(b.conf * 100).toFixed(0)}%`;
    const w = ctx.measureText(tag).width + 12;
    ctx.fillStyle = COLORS[b.cls];
    ctx.fillRect(x1, Math.max(0, y1 - ctx.lineWidth * 6), w, ctx.lineWidth * 6.5);
    ctx.fillStyle = "#000";
    ctx.fillText(tag, x1 + 6, Math.max(ctx.lineWidth * 5, y1 - ctx.lineWidth));
  }
  statusEl.textContent = data.boxes.length
    ? `✅ ${data.boxes.length} damage area${data.boxes.length > 1 ? "s" : ""} found in ${ms} ms (${sourceLabel})`
    : `ℹ️ No damage found in ${ms} ms (${sourceLabel}) — try closer or better light`;
}

document.getElementById("cam").addEventListener("change", e => {
  if (e.target.files[0]) detect(e.target.files[0], "your photo");
});

let thumbIndex = -1;
let thumbNames = [];
const SHOWCASE = "India_001790.jpg";  // test image with clear potholes

async function loadSamples() {
  try {
    const names = await (await fetch("/samples")).json();
    thumbNames = [SHOWCASE, ...names.filter(n => n !== SHOWCASE)].slice(0, 10);
    const box = document.getElementById("thumbs");
    for (const n of thumbNames) {
      const img = document.createElement("img");
      img.src = "/sample/" + n;
      img.dataset.name = n;
      img.onclick = () => runThumb(thumbNames.indexOf(n));
      box.appendChild(img);
    }
    // open with a photo that has visible damage — instant demo
    runThumb(0);
  } catch (e) { /* samples optional */ }
}

async function runThumb(i) {
  if (i < 0 || i >= thumbNames.length) return;
  thumbIndex = i;
  const n = thumbNames[i];
  const blob = await (await fetch("/sample/" + n)).blob();
  detect(blob, "sample " + n);
}

document.getElementById("sampleBtn").onclick = () =>
  runThumb((thumbIndex + 1) % thumbNames.length);
loadSamples();
</script>
</body>
</html>
